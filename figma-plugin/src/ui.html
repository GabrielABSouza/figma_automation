<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; }
  body { padding: 16px; background: #fff; }
  h2 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #0F172A; }
  textarea {
    width: 100%; height: 240px; padding: 8px; font-size: 12px; font-family: monospace;
    border: 1px solid #E2E8F0; border-radius: 8px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: #2563EB; }
  button {
    margin-top: 12px; width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
    background: #2563EB; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #1D4ED8; }
  button:disabled { background: #94A3B8; cursor: not-allowed; }
  .status { margin-top: 8px; font-size: 12px; color: #475569; }
  .error { color: #DC2626; }
</style>

<h2>Paste API Response JSON</h2>
<textarea id="json-input" placeholder='{"success": true, "screens": [...], ...}'></textarea>
<button id="render-btn" onclick="handleRender()">Render in Figma</button>
<div id="status" class="status"></div>

<script>
  function handleRender() {
    var textarea = document.getElementById("json-input");
    var status = document.getElementById("status");
    var btn = document.getElementById("render-btn");

    var raw = textarea.value.trim();
    if (!raw) {
      status.textContent = "Please paste JSON first.";
      status.className = "status error";
      return;
    }

    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      status.textContent = "Invalid JSON: " + e.message;
      status.className = "status error";
      return;
    }

    if (!parsed.success || !Array.isArray(parsed.screens)) {
      status.textContent = "JSON must have success=true and screens array.";
      status.className = "status error";
      return;
    }

    btn.disabled = true;
    status.textContent = "Rendering...";
    status.className = "status";

    parent.postMessage({ pluginMessage: { type: "render", payload: parsed } }, "*");
  }

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    var status = document.getElementById("status");
    var btn = document.getElementById("render-btn");

    if (msg.type === "render-complete") {
      status.textContent = "Done! Rendered " + msg.screenCount + " screen(s).";
      status.className = "status";
      btn.disabled = false;
    } else if (msg.type === "render-error") {
      status.textContent = "Error: " + msg.error;
      status.className = "status error";
      btn.disabled = false;
    }
  };
</script>
